name: Release

# Push a tag like v0.1.0 (matching package.json "version") to publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release
      id-token: write # Marketplace Trusted Publishing (vsce --oidc)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm test
      - run: npm run package
      - name: Publish to Visual Studio Marketplace
        run: npx vsce publish --oidc --packagePath iextlibraries-*.vsix
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT secret not set; skipping Open VSX"
            exit 0
          fi
          npx --yes ovsx publish iextlibraries-*.vsix -p "$OVSX_PAT"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" iextlibraries-*.vsix --title "iExternal libraries $GITHUB_REF_NAME" --notes "See [CHANGELOG.md](https://github.com/mahbubur001/vscode-iextlibraries/blob/main/CHANGELOG.md)."
